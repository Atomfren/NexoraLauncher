[package]
name = "nexora-setup"
version = "1.0.0"
edition = "2024"
description = "Установщик и деинсталлятор NexoraLauncher"
publish = false

[lib]
name = "nexora_setup"
path = "src/lib.rs"

[[bin]]
name = "nexora-setup"
path = "src/main.rs"

[[bin]]
name = "nexora-pack"
path = "src/bin/pack.rs"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
editpe = "0.2.4"
lzma-rust2 = "0.23.0"
mslnk = "0.1.8"
rfd = "0.17.2"
tar = "0.4.46"
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
